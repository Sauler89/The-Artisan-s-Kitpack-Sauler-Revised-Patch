name: Sauler Revised Static QA

on:
  push:
    branches:
      - master
      - sauler-revised-bootstrap
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Sauler Revised source invariants
        run: python tests/check_sauler_revised.py
