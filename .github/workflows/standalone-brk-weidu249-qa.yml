name: Standalone BRK WeiDU 249 QA

on:
  push:
    branches:
      - standalone-brk-weidu249-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4

      - name: Download WeiDU 249.00
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/weidu249.zip \
            https://github.com/WeiDUorg/weidu/releases/download/v249.00/WeiDU-Linux-249-amd64.zip
          mkdir -p /tmp/weidu249
          unzip -q /tmp/weidu249.zip -d /tmp/weidu249
          WEIDU=$(find /tmp/weidu249 -type f -name weidu -print -quit)
          test -n "$WEIDU"
          chmod +x "$WEIDU"
          echo "WEIDU=$WEIDU" >> "$GITHUB_ENV"
          "$WEIDU" --version

      - name: Parse standalone alpha2 source sections
        shell: bash
        run: |
          set -euo pipefail
          "$WEIDU" --parse-check TPH standalone-parser/functions_part1.tph
          "$WEIDU" --parse-check TPH standalone-parser/functions_part2.tph
          "$WEIDU" --parse-check TPA standalone-parser/main_part1.tpa
          "$WEIDU" --parse-check TPA standalone-parser/main_part2.tpa
          "$WEIDU" --parse-check TPA standalone-parser/main_part3.tpa
          "$WEIDU" --parse-check TPA standalone-parser/compat_saa54.tpa
          "$WEIDU" --parse-check TP2 standalone-parser/Setup-BerserkerRevisedKIT.tp2
